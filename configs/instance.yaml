# MESSIAH 인스턴스 설정 — 멀티 PC 복제 배포 시 PC마다 이 파일 하나만 다르다 (Ver 1.1 §7.2)
# 시크릿(앱키·계좌번호)은 .env에만 — 이 파일에는 env: 참조만 적는다 (SYSTEM.md §3)

instance_id: "messiah-dev-01"
mode: dev            # dev | paper | live | replay

broker:              # 주 브로커: KIS (Broker_API_Ranking 확정)
  name: kis
  account_ref: "env:KIS_ACCOUNT"
  app_key_ref: "env:KIS_APP_KEY"
  app_secret_ref: "env:KIS_APP_SECRET"
  is_paper: true

secondary_broker:    # 부 브로커: LS — 데이터 교차검증·유사시 대체 (이중화)
  name: ls
  account_ref: "env:LS_ACCOUNT"
  app_key_ref: "env:LS_APP_KEY"
  app_secret_ref: "env:LS_APP_SECRET"
  is_paper: true

capital:
  total: 50000000
  daily_loss_limit_pct: 2.0      # R2 → Kill Switch
  margin_cap_pct: 40.0           # Holding Policy §3
  overnight_margin_cap_pct: 25.0
  max_overnight_positions: 2

# 거래 대상 확정 (2026-08-04) — 어휘·검증은 src/messiah/core/universe.py.
# 종전 "K200_OPT" 단일 토큰은 소비자가 없어 죽어 있었다(설정에만 존재). 먼쓰리/월위클리/
# 목위클리는 만기 주기가 달라 체인·롤·그릭스가 전부 다르므로 시리즈마다 토큰을 준다.
universe:
  - K200_MINI_FUT        # 미니선물 (틱 0.02 실측)
  - K200_OPT_MONTHLY     # 먼쓰리 (정규 월물)
  - K200_OPT_WEEKLY_MON  # 월위클리
  - K200_OPT_WEEKLY_THU  # 목위클리
model_bundle: "none"                       # live 모드는 지정 필수 (자가 점검)
redis_url: "redis://localhost:6380/0"
# FeatureVector.feature_set — 정본은 `src/messiah/features/spec.py`의 FEATURE_SETS.
#
# 2026-08-10 B-4: v2026.07(PX+VL, 121개) → v2026.08-ev(PX+VL+EV, **137개**).
# (2026-08-16 정정: 이 줄이 원래 133개라고 적고 있었다. 실제는 82+39+16=137이다.
#  개수의 정본은 언제나 `spec.resolve(name).describe()`이고 주석이 아니다.)
# EV 계산기 12종은 2026-08-04부터 있었고 `v2026.08-ev`도 그때 정의됐는데, 여섯 거래일간
# 이 줄이 v2026.07이라 **한 번도 계산되지 않았다.** 그 사이 변동성 축 채점은 3개 Horizon
# 전부에서 `ev_tod_cos 미측정 — 피처셋에 없음`을 찍고 있었다(등록부 `ev-features-measured`).
#
# EV는 `calendar` 사이드카(참조 사이드카 — 미리 공표된 휴장일·만기)를 요구한다. 그것을
# 조립하는 정본은 `features/sidecar.build()`이고, 이 전환과 같은 커밋에서 진입점 셋
# (run_l1_daily·run_replay·backtest/harness)이 그것을 부르게 했다 — 안 그러면 수집기가
# "사이드카 ['calendar']가 주입되지 않았다"로 기동을 거부한다.
#
# **되돌리려면 이 줄만 v2026.07로.** 사이드카 주입은 그때도 무해하다(스펙이 안 요구하면
# `build()`가 아무것도 안 만든다).
feature_set: "v2026.08-ev"
futures_tick_size: "0.02"                  # 미니선물(A05608) 실측값 — 다른 상품엔 그대로 쓰지 말 것

# 1분봉 확정 방식 (2026-08-05 고도화 1) — tick | timer
#   tick  : 다음 분의 첫 틱이 도착하면 닫는다(종전 동작)
#   timer : 거래소 시각이 경계+유예를 지나면 닫는다(근본 처방)
#
# **2026-08-11 승격.** 조건이던 "며칠 p99를 보고 MINUTE_CLOSE_GRACE_SECONDS 확정"이 4거래일
# 실측으로 끝났다(그 상수 위 주석의 표). 4일 중 최악의 최대가 1.3964초(08-10)이고 유예는
# 2.0초 — 43% 여유. 같은 4일간 `late_bar_drops`가 연속 0이었다
# (등록부 `composer-bucket-completeness` 검증 완료).
#
# **되돌리려면 이 줄만 "tick"으로.** 채점은 다음 거래일 리포트의 `late_bar_drops`다 —
# 0이 아니면 그 건수만큼 유예 뒤 도착한 틱을 버린 것이고, 즉시 되돌린다.
minute_bar_close: "timer"
