# 수정 유효성 자동 검증 등록부 (고도화 B, 2026-08-03)
#
# 여기 적은 항목은 매 거래일 장후에 `logs/daily_integrity_*.json` 이력으로 자동 채점된다
# (`src/messiah/ops/fix_verification.py`). 목적은 하나다 — **"고쳤다"는 판단을 사람 기억이
# 아니라 다음 거래일의 실측이 내리게 하는 것**.
#
# 이게 없어서 2026-07-29~08-03에 같은 UI 크래시를 세 번 "고쳤다"고 판정하고 세 번 재발시켰다.
# 매번 판정 기준 자체는 기록돼 있었지만(예: "다음 거래일 native_crashes 0건"), 그걸 다음날
# 다시 꺼내 확인하는 일을 아무도 강제하지 않았다.
#
# 규칙:
#   - 등록일(registered) **다음** 거래일부터 채점한다. 수정은 그날 장 마감 후에 들어가므로
#     등록일 리포트는 수정 이전의 세계다.
#   - 한 번이라도 기준을 위반하면 즉시 `재발` — 그게 이 등록부의 존재 이유다.
#   - 판정이 `검증 완료`로 굳으면 이 파일에서 지운다. 안 지우면 매일 통과 줄만 쌓여
#     정작 봐야 할 `재발`이 묻힌다(DECISION_LOG의 "닫히면 태그를 지운다"와 같은 규율).
#
# 지표(metric)는 무결성 리포트에 실제로 있는 필드만 쓸 수 있다:
#   native_crashes · faulthandler_dumps · ui_restarts · restarts
#   critical_log_lines · breaches · missing_minutes · longest_gap_minutes
#   tick_rows  ← min 기준(2026-08-04 신설)
#
# ## 예측은 "좋아진다"가 아니라 "존재한다"부터 적는다 (2026-08-04, 마흐디에서 이식)
#
# **어떤 값을 쓰는 fix라면, 그 값이 실제로 생산되고 있다는 것을 먼저 예측치로 적는다.**
#
# 마흐디가 2026-08-03에 이걸 배웠다: 그날 예측 13개 중 12개가 자동 대조로 즉시 확인됐지만,
# 그 어떤 가설도 `find_gamma_flip()`이 **전 이력에서 한 번도 값을 돌려준 적이 없다**는 사실을
# 잡지 못했다 — 아무도 "감마플립이 계산되는가"를 예측치로 적지 않았고 *당연히 되고 있다*고
# 가정했기 때문이다. 그 결과 앙상블 멤버 하나가 넉 달간 죽어 있었고, 넉 달 동안 "개선"해 온
# 대상이 애초에 존재하지 않았다.
#
# MESSIAH도 같은 형태를 이미 두 번 겪었다 — `px_ema_cross_60`(NaN이라 흔적은 남았다)과
# `px_macd_h_5`(값을 내므로 **아무 흔적도 없었다**, 2026-08-04 피처 관문이 처음 발견).
# 그래서 `max` 기준만이 아니라 `min` 기준 항목을 적을 수 있게 했다.

verifications:
  - id: ui-crash-isolation
    summary: "UI polars 크래시 격리 — 봉 파싱을 자식 프로세스로 분리(P0-1b, 커밋 c790b58)"
    registered: 2026-08-03
    # 판정 기준이 "크래시 0건"인 게 핵심이다. 격리가 성공하면 자식이 죽어도 UI는 사는데,
    # **자식의 죽음도 여전히 네이티브 크래시로 집계된다** — 즉 이 기준은 "영향 격리"가 아니라
    # "원인 소멸"을 본다. 격리만 성공하고 크래시가 계속되면 `재발`로 뜨는 게 맞다: 화면은
    # 살았지만 근본 원인은 그대로라는 사실이 매일 드러나야 한다.
    metric: native_crashes
    max: 0
    # 3거래일 — 07-31 수정은 하루(08-03)만에 깨졌고, 07-30 수정은 당일 재발했다. 하루로는
    # 우연한 조용함과 구분이 안 된다. 이 값 자체는 미검증 초기값이다.
    consecutive_days: 3
    deadline: 2026-08-14

  - id: ui-restart-observability
    summary: "UI 재기동을 무결성 리포트 1급 임계로(P1-1) — 관측 공백이 조용히 지나가지 않는지"
    registered: 2026-08-03
    metric: ui_restarts
    max: 0
    consecutive_days: 3
    deadline: 2026-08-14

  - id: crash-forensics-armed
    summary: "faulthandler 상시 무장(P0-1a) — 크래시가 나도 증거가 남는 상태인지"
    registered: 2026-08-03
    # 무장 실패는 `breaches`에 "무장 마커 없음"으로 올라온다(`ops/crash_dumps.py`).
    # 그 항목이 하나라도 있으면 breaches가 0이 아니게 되므로 여기서 잡힌다 — 다만 이 지표는
    # 다른 사고에도 반응하는 **넓은 그물**이다. 좁은 지표(무장 여부 단독)가 필요해지면
    # `METRIC_EXTRACTORS`에 추가할 것.
    metric: breaches
    max: 0
    consecutive_days: 3
    deadline: 2026-08-14

  - id: tick-collection-live
    summary: "체결틱 원본 수집 결선(F2, 2026-08-04) — 결선만 하고 0행으로 끝나지 않는지"
    registered: 2026-08-04
    # **min 기준**이다 — 이 등록부에서 "일어나면 안 되는 일"이 아니라 "일어나야 하는 일"을
    # 재는 첫 항목이다(파일 헤더 "존재한다부터 적는다" 참고).
    #
    # 이 프로젝트는 폴러를 만들고 결선을 안 붙여 데이터를 잃은 전례가 셋 있다:
    # InvestorFlowPoller(7개월) · OptionChainPoller(수개월) · 그리고 FL 피처(모델 미도달).
    # 셋 다 "만들었으니 되고 있겠지"였고, 셋 다 몇 달 뒤에 발견됐다.
    #
    # 틱은 그중 최악이다 — KIS 분봉 API는 OHLCV만 주고 **체결 단위 과거 조회가 아예 없어**
    # 안 쌓인 날은 영원히 빈다.
    metric: tick_rows
    # 1,000행은 매우 느슨하다(실측 초당 3틱 ≈ 하루 5~10만행). "적게 쌓였다"가 아니라
    # **"결선이 끊겼다"**를 잡는 값이다.
    min: 1000
    # 3거래일 — 첫날 성공은 우연일 수 있다(재연결·스톨 경로를 안 탄 하루일 수 있음).
    consecutive_days: 3
    deadline: 2026-08-12
