    # 채점하므로 그때까지 조용히 "검증 대기"로 남는다 — 승격 전 며칠을 매일 "재발"로 울리면
    # 늑대소년이 되고, 그건 이 등록부가 가장 경계하는 실패다.
    #
    # 승격 절차(전부 장후, R11):
