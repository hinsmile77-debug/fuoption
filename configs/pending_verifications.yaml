    # 붙였다. 이 항목이 보는 것은 **그 설정이 오늘도 살아 있는가**다.
    #
    # **min 기준**이다(1=무장, 0=안 됨). 설정은 코드가 아니라 OS 상태라 테스트로 못 잡는다 —
    # 누가 작업을 지우거나 다시 만들면 조용히 08-06 이전으로 돌아가고, 그 사실은 다음
