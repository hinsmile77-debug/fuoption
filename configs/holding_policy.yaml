# 보유·청산 정책 수치 — Derivatives_AI_Position_Holding_Policy_Ver1.0.md §5-4
#
# 그 문서 §5-4는 "모든 수치는 configs/holding_policy.yaml — 계좌 규모가 커지면 수치만
# 완화, 구조는 불변"이라고 적었으나 2026-09-22까지 이 파일이 없었다. 값들이 각 모듈
# 상수로 흩어져 있었고, 그래서 "지금 손절이 몇 배인가"를 코드를 읽어야만 알 수 있었다.
#
# **이 파일이 없어도 기동한다** — 로더가 각 모듈의 기본 상수를 그대로 쓴다. 없는 파일이
# 기동을 막으면 재생·스모크 경로가 전부 깨진다(instance.yaml과 같은 취급).

futures_exit:
  # 장중 청산 엔진 (2026-09-22 F-119, `src/messiah/strategy/position_exit.py`)

  # 실제 주문을 내보내는가. false면 판정만 로그로 남기고 주문은 안 낸다(R18 섀도 계측).
  #
  # 2026-09-22 사용자 결정으로 **true(즉시 실청산)**. 09-15 F-104(장마감 강제청산)가 같은
  # 선택을 하고 6거래일 무사고로 돌았다는 것이 완화 근거다 — 주문 생성·제출 경로가
  # 그때와 **완전히 같다**(KillSwitch.liquidate() → OrderGateway.submit()).
  #
  # **되돌리려면 이 줄만 false로.** 그러면 `PositionExitShadow` 로그만 쌓인다.
  armed: true

  # 손절폭 = 이 배수 × 진입 시점 ATR(M1,14).
  #
  # 1.0인 이유는 취향이 아니다 — `risk/sizer.py`가 계약수를 정할 때 쓰는
  # `stop_distance_ticks`가 바로 `ATR(M1,14) × 1.0`이다(`strategy/pipeline.py` 호출부).
  # 사이저가 이미 전제한 값을 실행이 지키게 하는 것이라, 이 값을 바꾸면 **사이저도 같이**
  # 바꿔야 R1(단일 포지션 최대손실 2%)이 계속 성립한다. 한쪽만 바꾸면 두 축이 조용히
  # 어긋나고, 그 어긋남이 바로 이 기능이 고치려던 문제다.
  stop_atr_mult: 1.0

  # ③ 익절 배수 — 진입 시점 ATR(M1,14)의 몇 배에서 이익을 확정하는가. null이면 판정 자체를
  # 하지 않는다.
  #
  # 2.0인 이유: 손절 1.0과 짝을 이뤄 보상:위험 2:1(손익분기 승률 33%), 그리고 구동 Horizon
  # 30m 라벨의 배리어 폭 배수(`models/labeling._WIDTH_ATR_MULT[M30]` = 2.0)와 같은 숫자다.
  # 다만 라벨은 30분봉 ATR로 재고 여기는 1분봉 ATR이라 **축이 다르다** — 같은 2.0이어도 실제
  # 폭은 라벨보다 훨씬 좁다. 그래서 이 값은 "모델이 학습한 목표"가 아니라 계측용 기준선이다.
  take_profit_atr_mult: 2.0

  # ③ 익절을 실제 주문으로 내는가. false면 「여기서 익절했을 것」을 포지션당 한 번
  # `PositionExitShadow`로만 남긴다(R18 섀도 계측).
  #
  # **false인 근거는 실측이다**(2026-10-01, M1 봉 재구성). 실거래 8건(전부 LONG, 15:25 EOD
  # 청산)의 EOD 손익 합 = ATR 단위 +37.1. 같은 8건에 고정 익절을 씌우면 1.0배 +8.0 ·
  # 2.0배 +15.6 · 3.0배 +22.6 — **어느 배수도 그대로 둔 것보다 나빴다.** 8건·단일 국면이라
  # 결론은 아니고, 섀도 로그가 쌓이면 사람이 다시 본다. 켜려면 이 줄만 true로.
  take_profit_armed: false

  # 트레일링 스톱 (2026-10-02) — 고정 익절의 대안. 이익이 `trailing_activation_atr_mult ×
  # ATR` 이상 난 뒤, 최고 완성봉 종가 대비 `trailing_atr_mult × ATR`만큼 되밀리면 전량 청산.
  #
  # 실측(같은 8건, M1 종가 판정, 활성 1.0): 추적폭 1.0배 +26.2 · 1.5배 +26.9 · 2.0배 +32.4
  # (4/8 발동) · 3.0배 +37.3 vs EOD 그대로 +37.1 · 고정 익절 2.0배 +15.6. 고정 익절보다 확실히
  # 덜 자르지만 EOD 그대로를 이긴 배수는 없다(3.0배가 사실상 같다). 2.0은 09-22처럼 크게
  # 갔다가 되밀린 거래를 지키는 쪽(+1.4 → +2.7)과 추세 꼬리를 남기는 쪽의 중간값이다.
  trailing_atr_mult: 2.0
  trailing_activation_atr_mult: 1.0

  # 트레일링을 실제 주문으로 내는가 — false면 첫 도달만 `PositionExitShadow`로 남긴다.
  # 8건으로는 EOD를 이긴다는 근거가 없어 섀도로 시작한다. 켜려면 이 줄만 true로.
  trailing_armed: false

  # ④ⓐ 논지 소멸 — 신호 반전. 보유 방향의 **반대** 의도(LONG 보유 중 SHORT)가 나오면
  # 다음 판단(FuturesView) 시점에 전량 청산하고, 그 사이클에는 새로 진입하지 않는다.
  #
  # true인 이유: 근거가 진입시킨 그 판단 엔진의 반대 결론이고(국면별 임계·불확실성·분산
  # 게이트 전부 통과), 신호 **약화**(같은 방향, 임계 미달 → NO_TRADE)는 포함하지 않는다.
  # 2026-09-22(15:00에 S 0.31→0.19, 그래도 EOD +113틱)가 약화를 빼야 하는 실례다.
  # 지금까지 실거래 8건 중 이 조건에 닿은 건은 0건 — 승리를 자른 반사실이 없다.
  thesis_reversal_armed: true

  # ④ⓑ 논지 소멸 — 불리한 국면 전환. 진입 때와 국면이 달라졌고 새 국면이 포지션에 불리한
  # 추세(LONG에 TREND_DOWN, SHORT에 TREND_UP)일 때.
  #
  # false(섀도)인 이유: 국면 라벨이 판단 엔진보다 나은 청산 근거라는 증거가 없다. 2026-09-16
  # 국면은 30분마다 TREND_UP→RANGE→TREND_DOWN(확신도 0.44)→HIGH_VOL로 바뀌었고, 그
  # TREND_DOWN 안에서 들어간 LONG이 +346틱(6.9×ATR)으로 끝났다.
  thesis_regime_armed: false

  # 청산 주문을 낸 뒤 같은 심볼을 다시 보기까지 기다리는 시간(초).
  #
  # 시장가라도 브로커 응답과 포지션 갱신 사이에 지연이 있다. 그 사이 다음 완성봉이 오면
  # 이미 내보낸 것을 또 내보내고, 그러면 **없던 방향의 포지션이 새로 생긴다** — 중복
  # 청산은 미청산보다 고치기 어렵다. 판정 주기가 60초(M1 완성봉)라 120초면 한 봉을 거른다.
  # 포지션이 실제로 줄거나 사라지면 이 시간과 무관하게 즉시 해제된다.
  resubmit_cooldown_seconds: 120.0
