# 관측 공백의 **원인**을 사람이 산출물에 되먹이는 자리 (2026-08-19 장후 F-6 / P2-1).
#
# ## 왜 이 파일이 생겼나
#
# 2026-08-19에 두 프로세스가 09:50·09:30에 죽어 세 시간 가까이 사라졌다. 호스트 이벤트
# 로그에는 05:52 부팅 3건만 있고 09:50 부근 이벤트는 **0건**이라, 무결성 리포트의
# `observation_gaps`는 두 건 다 이렇게 봉인했다:
#
#     "cause": "원인 불명 — 호스트 종료 이벤트 없음"
#
# 그런데 같은 날 12:14에 사람이 조사를 끝내고 원인을 **Windows Update로 확정**해
# `logs/dailycheck/2026-08-19_incident_0950_deepdive.md`에 적어 두었다. 즉 그날의 원인은
# 알려져 있었는데 **산출물은 그것을 모른 채로 저장됐다.** 리포트를 나중에 읽는 사람도,
# 며칠치를 접는 롤링 소비자도, 그 사실에 닿을 길이 없다.
#
# 자동 판정(`ops/observation_gaps._cause_for()`)은 호스트 이벤트만 본다. 그건 옳다 —
# 지어내지 않는 것이 그 함수의 규율이다. 이 파일은 그 규율을 깨지 않고 **사람이 아는 것을
# 따로 적는 통로**다. 자동 판정이 원인을 찾으면 그쪽이 이긴다(기계가 본 증거가 더 강하다).
#
# ## 쓰는 법
#
#   - date        YYYY-MM-DD. 그날 리포트에만 적용된다.
#     process     `l1_daily` | `g2_paper` | `ui`
#     from_kst    공백 시작 시각(HH:MM:SS). 리포트의 `observation_gaps[].from_kst`와 맞춘다.
#                 ±`tolerance_minutes`(기본 5분) 안이면 같은 공백으로 본다 — 시각 추정이
#                 로그 갱신으로 몇 분 움직여도 짝이 유지되게 한다.
#     cause       사람이 읽을 한 문장. 리포트의 `cause`를 이 값으로 덮는다.
#     evidence    근거 문서 경로. **필수로 적는다** — 근거 없는 단정은 이 파일을
#                 「사람이 기억으로 쓰는 칸」으로 만들고, 그러면 자동 판정보다 못해진다.
#
# 여기 없는 공백은 종전대로 자동 판정 결과가 그대로 남고 `cause_source: "auto"`가 붙는다.

incidents:
  - date: 2026-08-19
    process: l1_daily
    from_kst: "09:50:29"
    cause: "Windows Update 재시작 — 활성 시간(19~20시) 설정이 장중을 안 덮었다"
    evidence: logs/dailycheck/2026-08-19_incident_0950_deepdive.md

  - date: 2026-08-19
    process: g2_paper
    from_kst: "09:30:01"
    cause: "Windows Update 재시작 — 활성 시간(19~20시) 설정이 장중을 안 덮었다"
    evidence: logs/dailycheck/2026-08-19_incident_0950_deepdive.md
