#
# **의도적으로 제외한 특이일 2개** (완전 휴장이 아니라 "정규 시간과 다르게 개장"이라 이진
# (거래일/휴장일) 모델에 안 맞음 — EventCalendar.is_trading_day()는 이 두 날에도 True를
# 반환한다, 개장시간 자체가 다르다는 사실은 별도로 미모델링 상태로 남김):
#   - 2026-11-19 대학수학능력시험일: 관례상 개장을 통상 09:00에서 1시간 늦춘다(지연개장,
#     조기폐장 아님 — 일부 집계 사이트가 "Early Close"로 잘못 표기하는 경우를 발견함).
#   - 2026-12-31 연말 마지막 거래일: 관례상 오후 1시 조기폐장(전일 휴장 아님).
#
# 형식: 연도(int) → ISO 날짜 문자열 목록. is_trading_day()가 없는 연도를 조회하면 데이터
# 누락을 침묵으로 넘기지 않고 ValueError를 던진다(SYSTEM.md L3 침묵 실패 금지 원칙) — 연도가
# 바뀌면 이 파일도 갱신이 필요하다는 신호.

