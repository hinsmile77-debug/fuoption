# KRX(한국거래소) 파생상품시장 휴장일 — Event Calendar 데이터 소스 (2026-07-27 신설)
#
# **출처 주의 — 공식 실측 아님**: 이 목록은 KRX 공식 개장일 공지(kind.krx.co.kr)를 직접
# 확인하지 못해(접속 차단·JS 렌더링) 공개 집계 사이트 2곳(tradinghours.com 계열
# calendarlabs.com, forexchurch.com)을 교차대조해 작성했다 — "구현됨≠검증됨" 원칙 그대로,
# 이 파일도 "작성됨≠KRX 공식 확인됨"이다. 스케줄러 자동화(schtasks)에 실제로 쓰기 전에는
# 반드시 KRX 공식 공지로 재확인할 것(run_l1_daily.py는 여전히 schtasks 미등록 — 수동 실행만
# 하는 지금 단계에서는 이 목록이 틀려도 사람이 매번 실행 여부를 판단하므로 피해가 없다).
#
# **의도적으로 제외한 특이일 2개** (완전 휴장이 아니라 "정규 시간과 다르게 개장"이라 이진
# (거래일/휴장일) 모델에 안 맞음 — EventCalendar.is_trading_day()는 이 두 날에도 True를
# 반환한다, 개장시간 자체가 다르다는 사실은 별도로 미모델링 상태로 남김):
#   - 2026-11-19 대학수학능력시험일: 관례상 개장을 통상 09:00에서 1시간 늦춘다(지연개장,
#     조기폐장 아님 — 일부 집계 사이트가 "Early Close"로 잘못 표기하는 경우를 발견함).
#   - 2026-12-31 연말 마지막 거래일: 관례상 오후 1시 조기폐장(전일 휴장 아님).
#
# 형식: 연도(int) → ISO 날짜 문자열 목록. is_trading_day()가 없는 연도를 조회하면 데이터
# 누락을 침묵으로 넘기지 않고 ValueError를 던진다(SYSTEM.md L3 침묵 실패 금지 원칙) — 연도가
# 바뀌면 이 파일도 갱신이 필요하다는 신호.

# **2026-08-04 부분 실측 반영**: 백필(`scripts/run_backfill.py`)이 2025-12-12~2026-07-23의
# 모든 평일에 대해 KIS 분봉을 요청했고, 응답이 빈 날 = 그날 파생 거래가 없던 날이다. 이건
# 집계 사이트가 아니라 **거래소 데이터에서 직접 나온 증거**라 위 목록보다 강한 근거다.
# 실측 구간에서 확인된 휴장일에는 `# 실측` 표시를 붙였다. 그 구간 밖(2026-08-17 이후)은
# 여전히 미검증 집계값이다.
#
# 실측으로 **발견한 누락 1건**: 2026-07-17(제헌절)이 목록에 없었는데 실제로는 휴장이었다.
# 이 파일만 믿었다면 그날을 거래일로 알고 결손으로 오해했을 것이다.
#
# 실측과 **어긋나는 주석 1건**: 위 "2026-12-31 연말 마지막 거래일 조기폐장(휴장 아님)"은
# 2025-12-31이 실측으로 완전 휴장이었던 것과 맞지 않는다. 연도가 달라 단정하지 않고 남겨두되,
# 2026-12-31이 실제로 오면 반드시 재확인할 것.

