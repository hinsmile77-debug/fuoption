# KRX(한국거래소) 파생상품시장 휴장일 — Event Calendar 데이터 소스 (2026-07-27 신설)
#
# **출처 주의 — 공식 실측 아님**: 이 목록은 KRX 공식 개장일 공지(kind.krx.co.kr)를 직접
# 확인하지 못해(접속 차단·JS 렌더링) 공개 집계 사이트 2곳(tradinghours.com 계열
# calendarlabs.com, forexchurch.com)을 교차대조해 작성했다 — "구현됨≠검증됨" 원칙 그대로,
# 이 파일도 "작성됨≠KRX 공식 확인됨"이다. 스케줄러 자동화(schtasks)에 실제로 쓰기 전에는
# 반드시 KRX 공식 공지로 재확인할 것(run_l1_daily.py는 여전히 schtasks 미등록 — 수동 실행만
# 하는 지금 단계에서는 이 목록이 틀려도 사람이 매번 실행 여부를 판단하므로 피해가 없다).
#
# **의도적으로 제외한 특이일 1개** (완전 휴장이 아니라 "정규 시간과 다르게 개장"이라 이진
# (거래일/휴장일) 모델에 안 맞음 — EventCalendar.is_trading_day()는 이 날에도 True를
# 반환한다, 개장시간 자체가 다르다는 사실은 별도로 미모델링 상태로 남김):
#   - 2026-11-19 대학수학능력시험일: 관례상 개장을 통상 09:00에서 1시간 늦춘다(지연개장,
#     조기폐장 아님 — 일부 집계 사이트가 "Early Close"로 잘못 표기하는 경우를 발견함).
#     ⚠ 이 하루는 **08:45 첫 틱 전제가 깨진다** — 화면·리포트가 오전 내내 "봉이 없다"로
#       오탐할 것이다(`SessionHours.first_tick_time`). 세션 시간표를 날짜별로 갖는 것이
#       정답이고 그건 NEXT_TODO에 별도 항목으로 있다. 지금은 **알려진 오탐**이다.
#
# 종전에 여기 있던 두 번째 항목("2026-12-31 연말 마지막 거래일은 오후 1시 조기폐장, 휴장
# 아님")은 **2026-08-17에 철회했다** — 아래 2026 목록의 그 줄에 근거를 적었다.
#
# 형식: 연도(int) → ISO 날짜 문자열 목록. is_trading_day()가 없는 연도를 조회하면 데이터
# 누락을 침묵으로 넘기지 않고 ValueError를 던진다(SYSTEM.md L3 침묵 실패 금지 원칙) — 연도가
# 바뀌면 이 파일도 갱신이 필요하다는 신호.
#
# **연도가 아닌 키(`covered_through`)도 이 파일에 있다** (2026-08-17). 로더는 4자리 숫자
# 키만 데이터로 읽고 나머지는 건너뛴다(`core/event_calendar.holidays_from_document`).
#
# ⚠ **주말은 여기 적지 않는다.** `is_trading_day()`가 `weekday() < 5`로 계산한다. 주말을
#   적기 시작하면 매년 104줄이 늘고, 그 줄을 안 채운 해가 조용히 생긴다(마흐디의 같은 규약).

# **2026-08-04 부분 실측 반영**: 백필(`scripts/run_backfill.py`)이 2025-12-12~2026-07-23의
# 모든 평일에 대해 KIS 분봉을 요청했고, 응답이 빈 날 = 그날 파생 거래가 없던 날이다. 이건
# 집계 사이트가 아니라 **거래소 데이터에서 직접 나온 증거**라 위 목록보다 강한 근거다.
# 실측 구간에서 확인된 휴장일에는 `# 실측` 표시를 붙였다. 그 구간 밖(2026-08-17 이후)은
# 여전히 미검증 집계값이다.
#
# 실측으로 **발견한 누락 1건**: 2026-07-17(제헌절)이 목록에 없었는데 실제로는 휴장이었다.
# 이 파일만 믿었다면 그날을 거래일로 알고 결손으로 오해했을 것이다.
#
# 실측과 **어긋나던 주석 1건 — 2026-08-17에 실측 쪽으로 정리했다**: "2026-12-31 조기폐장
# (휴장 아님)"이 2025-12-31 실측 완전 휴장과 맞지 않았다. 그때는 연도가 다르다는 이유로
# 단정을 피했지만, 마흐디의 사람-확인 KRX 안내가 같은 방향을 가리켜 12-31을 등재했다.
# **연도가 달라도 되는 근거였다** — 연말 휴장은 거래소의 고정 관례이고, 연도별로 달라지는
# 것은 음력 명절과 대체공휴일이다.

# 사람이 **여기까지는 확인해서 채웠다**는 선언 (2026-08-17 신설).
#
# ## 왜 연도 목록만으로는 부족했나
#
# `is_trading_day()`가 미등록 연도에 예외를 던지는 것은 옳지만 **늦다** — 2027년 첫 거래일
# 아침에 처음 울린다. 그날은 이미 늦다: 그때 진입점은 「거래일 판정 불가」로 접어 수집을
# 진행하므로(비대칭 규약, 아래) 조용히 지나가고, 신정·설날에도 그대로 뜬다.
#
# 그래서 사람이 어디까지 확인했는지를 선언하고, 그 날짜가 가까워지면 자가 점검이 매일
# 경고한다(`scripts/self_check.py`의 `calendar` 축 — **기동은 막지 않는다**).
# 선행 프로젝트 마흐디가 같은 결론에 도달해 쓰고 있는 규약이다
# (`mahdi/config/market_holidays.yaml` — *"안 채운 걸 아무도 모르는 것"*).
#
# ⚠ **2027년은 2026-12-01까지 채울 것**(NEXT_TODO 등재 항목). 빠뜨리기 쉬운 둘:
#   - **근로자의날(05-01)** — 법정공휴일이 아니지만 KRX는 휴장한다.
#   - **연말 휴장일(12-31)** — 위와 같은 이유. 관공서 공휴일 목록만 보면 둘 다 놓친다.
#   대체공휴일은 **원래 날짜가 아니라 대체된 평일**을 적는다(주말은 계산이 잡는다).
#
# ## 미등재는 「거래일」로 접는다 — 이 방향이 규약이다
#
# 오류의 비용이 비대칭이다: 빠뜨린 휴장일은 휴장일에 시스템이 뜨는 것이고 다음날 데이터로
# 잡힌다. 잘못 넣은 날짜는 **거래일에 시스템이 안 뜨는 것**이고, 그날 체결틱·수급·옵션체인은
# 소급 경로가 없어 영구 소실이다. 그래서 **확신이 없는 날짜는 넣지 않는다** —
# `ops/session_guard.non_trading_day_reason()`도 판정 불가를 "거래일"로 접는다.
covered_through: "2026-12-31"

