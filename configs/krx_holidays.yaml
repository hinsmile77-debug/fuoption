# ## 출처 — 선행 프로젝트 2곳을 먼저 봤고, 둘 다 그대로 쓸 수 없었다
#   - 마흐디 `mahdi/config/market_holidays.yaml`: 2027 항목 없음(covered_through=2026-12-31).
#   - 미륵이 `futures/config/krx_holidays.py`: 2027 "예정(추정)" 목록이 있으나 **틀린 곳이 있다** —
#     ① 2027-02-05(금)을 「설날 전날」로 넣었다. 한국 음력으로 설날은 **02-07(일)**이라
#        (합삭 2027-02-06 15:56 UTC = 02-07 00:56 KST — 중국 설 02-06과 하루 어긋난다) 연휴는
#        02-06~02-08, 02-05는 **정상 거래일**이다. 그대로 가져왔다면 거래일 하루가 영구 소실된다.
#     ② 누락 7건 — 설 대체(02-09) · 노동절 대체(05-03) · 부처님오신날(05-13) · 제헌절 대체(07-19)
#        · 추석 3일(09-14~16) · 한글날 대체(10-11) · 성탄절 대체(12-27).
#   그래서 정부 계열 원자료로 다시 짰다:
#   - 한국천문연구원 달력자료 2027(astro.kasi.re.kr/kor/life/post/calendarData?year=2027) — 아래
#     날짜 전부와 대체공휴일 6건이 일치한다.
#   - 우주항공청 「2027년도 월력요항」 보도(2026-06-29 발표, 비건뉴스 2026-07-09 기사) — 설 2/6~2/9,
#     제헌절 7/17~19, 광복절 8/14~16, 추석 9/14~16, 개천절 10/2~4, 한글날 10/9~11, 성탄 12/25~27
#     연휴 구간이 위와 일치한다.
# ## 공휴일 → KRX 휴장으로 옮긴 근거
#   KRX 휴장일 = 관공서 공휴일(대체공휴일 포함) + 근로자의날/노동절 + 연말 휴장일. 2026년에
#   대체공휴일(03-02·10-05)과 제헌절(07-17)이 실제로 휴장이었다(위 2026 절 실측).
#   2027부터 노동절(05-01)이 법정공휴일이 되어 **대체공휴일이 붙는다** — 05-01이 토요일이라 05-03(월).
#   제헌절은 2026년에 공휴일로 복귀했고 2027-07-17이 토요일이라 07-19(월)가 대체공휴일이다.
# ## 남은 불확실성 — KRX 공지로 대조할 것
#   05-03(노동절 대체) · 07-19(제헌절 대체) · 12-27(성탄절 대체)는 **법 개정·대체 규정으로 생긴 날**이라
#   KRX가 휴장으로 채택하는지가 공지 전에는 확정이 아니다. 2026년 대체공휴일 전례로 넣었다.
#   2027년에는 선거일 없음(대선 2030·총선 2028·지선 2026 종료).
# 주말에 떨어진 공휴일(05-01 노동절·06-06 현충일·07-17 제헌절·08-15·10-03·10-09·12-25·설 02-06~07)은
# 적지 않는다 — 주말은 계산이 잡는다.
