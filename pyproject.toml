[project]
name = "messiah"
version = "0.1.0"
description = "MESSIAH - Autonomous Derivatives AI (KOSPI200 mini futures + options)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "redis>=5.0",
    "polars>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # ws_client.py/collector.py/bar_composer.py가 직접 import — L1 데이터 수집(UI 아님)의
    # 핵심 의존성인데 "ui" extras에 잘못 분류돼 있었다. 지금 이 세션의 .venv는 우연히 이미
    # ui extras까지 설치된 상태라 안 드러났지만, run_l1_daily.py를 위한 무인 운영용 venv를
    # base 의존성만으로 새로 만들면 ImportError로 즉시 죽었을 것 — 2026-07-24 발견, 여기로 옮김.
    "websockets>=12.0",
    # Windows에는 시스템 tzdata가 없어(Linux/macOS와 달리) polars가 tz-aware datetime 컬럼을
    # Parquet에서 다시 읽을 때 zoneinfo로 "UTC" 존을 못 찾아 ZoneInfoNotFoundError가 난다
    # (data/archiver.py 실측, 2026-07-22) — 로컬 datetime 생성 자체(core/timeutil.py)는 고정
    # offset이라 tzdata가 필요 없지만, polars의 왕복 읽기에는 필요하다.
    "tzdata>=2026.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# lightgbm==4.3.0 (범위가 아니라 정확히 이 버전): 4.7.0의 Windows 휠(numpy 2.5.1 +
# Python 3.12 조합, 2026-07-26 실측)이 lgb.Dataset.construct()의 set_label 단계에서
# 확정적으로 OSError(access violation)를 일으킴 — Dataset 생성 자체가 안 됨(데이터
# 크기·내용과 무관, 15행/500행 전부 재현). 처음엔 `>=4.3,<4.7`로 상한만 뒀었는데
# `uv lock`이 그 범위의 최신인 4.6.0을 골라버려(4.3.0만 실측했지 4.4~4.6은 검증한 적
# 없음) 실측 안 한 버전이 조용히 깔릴 뻔했다 — 정확히 실측한 버전으로 못박음. 4.3.0은
# weight·feature_name·저장/재로드·feature_importance까지 전부 정상 동작 확인함. 버전을
# 올리려면(4.4~4.6 어딘가에서 고쳐졌을 수도 있음, 개별 확인 안 함) 반드시
# tests/strategy/futures/test_expert.py(학습→예측→저장→재로드 전체 경로)로 먼저 검증할 것.
# hmmlearn 0.3.3(현재 설치·2026-07-27 기준 PyPI 최신)의 내부 코드가 numpy 2.5의 배열
# shape 직접 대입 금지 예고(DeprecationWarning)에 아직 안 맞춰져 있음 — 우리 코드가 아니라
# hmmlearn 내부(utils.py)라 지금은 고칠 수 없고, 테스트 통과에도 영향 없어 방치 중
# (Docs/capability_matrix.md "hmmlearn 0.3.3 + numpy 2.5 DeprecationWarning" 참고). numpy를
# 올리기 전에 반드시 tests/strategy/regime/ 전체(hmm_model·naming·rules·service·runtime)를
# 먼저 확인할 것 — 이 경고가 실제 에러로 바뀌는 numpy 릴리스가 나올 수 있다는 경고 문구 그대로.
ml = ["lightgbm==4.3.0", "scikit-learn>=1.4", "numpy>=1.26", "optuna>=3.6", "hmmlearn>=0.3"]
# streamlit/plotly: Command Center UI 1단계 프로토타입(Ver 1.0.1 §3.4 "1단계는 Streamlit/Dash로
# 빠르게", Ver 2.0 §9 W32~34) — fastapi/uvicorn은 Ver 2.2(React 이관) 대비 유지, 아직 미사용.
ui = ["fastapi>=0.111", "uvicorn>=0.30", "streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messiah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# SYSTEM.md R3: naive datetime 금지 — datetime.now()/utcnow() 직접 호출을 lint로 차단
select = ["E", "F", "I", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Command Center UI는 **무거운 임포트보다 먼저** 네이티브 크래시 덤프를 무장해야 한다
# (2026-08-03 — `core/crash_forensics.py` 모듈 docstring 참고). 이 프로세스는 5거래일 연속
# access violation으로 즉사했는데 로그에 흔적이 없었고, 임포트 도중의 크래시까지 덮으려면
# `crash_forensics.enable()`이 import 블록을 가를 수밖에 없다. 의도된 배치라 파일 단위로
# 면제한다 — 임포트마다 `# noqa`를 다는 것보다 이유가 한 곳에 남는다.
"src/messiah/ui/app.py" = ["E402"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.11"  # requires-python과 동일 — 미지정 시 pyright가 더 낮은 버전을 가정해
# `tuple[...]`/`dict[...]` 같은 PEP 585 builtin 제네릭 구독을 오탐 오류로 표시함(2026-07-26
# models/cv.py 작업 중 발견 — 실제로는 3.9+에서 안전, .venv도 3.12).
