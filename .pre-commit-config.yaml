repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # `logs/`는 **기계가 쓴 산출물**이라 제외한다 (2026-08-20).
      #
      # 2026-08-19 .gitignore 철회로 지표 JSON 55종이 추적 대상이 됐는데, 그 파일들은
      # `json.dumps()`가 끝 개행 없이 쓴다. 훅이 개행을 붙이면 **다음 장후 배치가 다시
      # 떼어내고**, 그러면 매일 56파일이 「수정됨」으로 뜬다. 그 잡음이 진짜 미커밋 변경을
      # 가린다 — 2026-08-19 장전 1-1이 CRLF 잡음 87파일로 지적한 것과 같은 형태다.
      #
      # 이 훅들은 사람이 쓰는 소스의 위생 도구다. 산출물의 바이트를 고치는 자리가 아니다.
      - id: trailing-whitespace
        exclude: ^logs/
      - id: end-of-file-fixer
        exclude: ^logs/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 코드만 고치고 판단을 안 남긴 커밋을 눈앞에 띄운다 (2026-08-10 C-2).
  # 2026-08-10 ce91b08이 그날 오전을 잃은 사고를 고치고도 dev_memory를 안 남겼다.
  # **경고만 한다** — 막으면 `--no-verify`가 습관이 되고 그러면 위 검사들까지 함께 꺼진다.
  # `pass_filenames: false`인 이유: 판정 대상이 "dev_memory가 **안** 바뀐 상태"라
  # 파일 목록 인자로는 볼 수 없고 스테이징 전체를 봐야 한다.
  - repo: local
    hooks:
      - id: dev-memory-updated
        name: dev_memory 갱신 확인(경고만)
        entry: python scripts/check_dev_memory_updated.py
        language: system
        pass_filenames: false
        always_run: true
